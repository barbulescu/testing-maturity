name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build probe and classifier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      examples: ${{ steps.examples.outputs.list }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Unit tests, ArchUnit rules and the Java 8 class-file check, plus the classifier tests.
      - run: ./gradlew :probe:build :classifier:test

      # One harness test class per example. Derived from the files so new examples are picked up automatically.
      - id: examples
        run: |
          list=$(ls harness/src/test/java/ch/barbulescu/testability/harness/*Test.java \
            | xargs -n1 basename | sed 's/\.java$//' | jq -R . | jq -sc .)
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            probe/build/reports/jacoco/test/
            classifier/build/reports/jacoco/test/

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-reports
          path: |
            probe/build/reports/tests/
            classifier/build/reports/tests/

  examples:
    name: Example ${{ matrix.example }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.build.outputs.examples) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Dependencies the example's containers download, kept between runs so 18 parallel
      # jobs don't all fetch them from Maven Central at once (which gets rate limited).
      - uses: actions/cache@v4
        with:
          path: |
            build/harness-cache/gradle/caches/modules-2
            build/harness-cache/m2/repository
            build/harness-cache/m2/wrapper
          key: harness-${{ matrix.example }}-${{ hashFiles('examples/**/*.gradle.kts', 'examples/**/pom.xml', 'examples/**/maven-wrapper.properties') }}
          restore-keys: harness-${{ matrix.example }}-

      # Publishes the probe to build/probe-repo, then builds the example in a container
      # (Docker on the runner) with and without the probe.
      - run: ./gradlew :harness:test --tests "ch.barbulescu.testability.harness.${{ matrix.example }}"

      # The containers write the cache as root. Hand it back to the runner so the cache can
      # be saved, and drop the probe, which must never be restored from a cache.
      - name: Prepare dependency cache for saving
        if: always()
        run: |
          if [ -d build/harness-cache ]; then
            sudo chown -R "$(id -u):$(id -g)" build/harness-cache
            rm -rf build/harness-cache/m2/repository/ch/barbulescu
            find build/harness-cache/gradle/caches/modules-2 -name '*.lock' -delete 2>/dev/null || true
          fi

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report-${{ matrix.example }}
          path: harness/build/reports/tests/

  # Publishes coverage badges (unit tests of probe and classifier) to the `badges` branch.
  # Code the probe runs inside the example containers is not included.
  coverage-badge:
    name: Coverage badge
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: coverage

      - id: jacoco
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: >-
            coverage/probe/build/reports/jacoco/test/jacocoTestReport.csv
            coverage/classifier/build/reports/jacoco/test/jacocoTestReport.csv
          badges-directory: badges
          generate-branches-badge: true

      - name: Coverage summary
        run: |
          echo "Instruction coverage: $(awk '{printf "%.1f%%", $1*100}' <<< '${{ steps.jacoco.outputs.coverage }}')" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch coverage: $(awk '{printf "%.1f%%", $1*100}' <<< '${{ steps.jacoco.outputs.branches }}')" >> "$GITHUB_STEP_SUMMARY"

      - name: Push badges to the badges branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init -q publish
          cd publish
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin badges; then
            git checkout -q -B badges FETCH_HEAD
          else
            git checkout -q --orphan badges
          fi
          cp ../badges/*.svg .
          git add -- *.svg
          if git diff --cached --quiet; then
            echo "Badges unchanged"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "Update coverage badges for ${GITHUB_SHA::7}"
          git push -q origin badges
