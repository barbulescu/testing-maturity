name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build probe and classifier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      examples: ${{ steps.examples.outputs.list }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Unit tests, ArchUnit rules and the Java 8 class-file check, plus the classifier tests.
      - run: ./gradlew :probe:build :classifier:test

      # One harness test class per example. Derived from the files so new examples are picked up automatically.
      - id: examples
        run: |
          list=$(ls harness/src/test/java/ch/barbulescu/testability/harness/*Test.java \
            | xargs -n1 basename | sed 's/\.java$//' | jq -R . | jq -sc .)
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-reports
          path: |
            probe/build/reports/tests/
            classifier/build/reports/tests/

  examples:
    name: Example ${{ matrix.example }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.build.outputs.examples) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Publishes the probe to build/probe-repo, then builds the example in a container
      # (Docker on the runner) with and without the probe.
      - run: ./gradlew :harness:test --tests "ch.barbulescu.testability.harness.${{ matrix.example }}"

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report-${{ matrix.example }}
          path: harness/build/reports/tests/
