name: Release

# Pushing a tag vX.Y.Z publishes the probe and its Maven extension as version X.Y.Z to Maven Central, after the
# whole CI passes on the tagged commit. The build files keep their -SNAPSHOT version.
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-tag:
    name: Check tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: check-tag
    uses: ./.github/workflows/ci.yml
    # ci.yml's coverage-badge job asks for write access. It only runs for pushes to main,
    # so it is skipped here, but a called workflow can't ask for more than its caller grants.
    permissions:
      contents: write

  publish:
    name: Publish ${{ needs.check-tag.outputs.version }} to Maven Central
    needs: [check-tag, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        with:
          # Dependencies come from the gradle-deps cache instead (see the build job in ci.yml).
          cache-disabled: true

      # The dependencies CI's build job saved, so publishing downloads nothing.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-deps-${{ hashFiles('*.gradle.kts', '*/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-deps-

      # Signs with the CI-only subkey and waits until Central reports the release as published,
      # so a deployment Central rejects fails this job. Both artifacts share the version: the
      # extension adds the probe of its own version.
      - run: >-
          ./gradlew :probe:publishAndReleaseToMavenCentral :maven-extension:publishAndReleaseToMavenCentral
          -PreleaseVersion=${{ needs.check-tag.outputs.version }}
          -PmavenCentralDeploymentValidation=PUBLISHED
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  # Makes the docs on main show the version just released (scripts/update-doc-versions.py).
  # [skip ci]: the commit changes only docs, and CI already ran on the tagged commit.
  update-docs:
    name: Show ${{ needs.check-tag.outputs.version }} in the docs
    needs: [check-tag, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - run: python3 scripts/update-doc-versions.py ${{ needs.check-tag.outputs.version }}

      - name: Push to main
        run: |
          if git diff --quiet; then
            echo "Docs already show ${{ needs.check-tag.outputs.version }}"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qam "Show ${{ needs.check-tag.outputs.version }} in the docs [skip ci]"
          git push -q origin HEAD:main
